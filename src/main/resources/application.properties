quarkus.application.name=boilerplate-quarkus
quarkus.http.port=8080

quarkus.datasource.db-kind=h2
quarkus.datasource.active=true
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/boilerplate;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false
quarkus.datasource.dev-ui.enabled=true
quarkus.datasource.dev-ui.allow-sql=true
quarkus.datasource.dev-ui.append-to-default-select=LIMIT 100

quarkus.datasource.mssql.db-kind=mssql
quarkus.datasource.mssql.active=false
quarkus.datasource.mssql.username=${MSSQL_USER:sa}
quarkus.datasource.mssql.password=${MSSQL_PASSWORD:Your_password123}
quarkus.datasource.mssql.jdbc.url=jdbc:sqlserver://${MSSQL_HOST:localhost}:${MSSQL_PORT:1433};databaseName=${MSSQL_DATABASE:boilerplate};encrypt=true;trustServerCertificate=true
quarkus.datasource.mssql.devservices.enabled=false

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

%sqlserver.quarkus.datasource.active=false
%sqlserver.quarkus.datasource.mssql.active=true
%sqlserver.quarkus.hibernate-orm.datasource=mssql
%sqlserver.quarkus.hibernate-orm.schema-management.strategy=update
%sqlserver.quarkus.hibernate-orm.sql-load-script=no-file
%sqlserver.quarkus.datasource.dev-ui.append-to-default-select=OFFSET 0 ROWS FETCH NEXT 100 ROWS ONLY

quarkus.swagger-ui.always-include=true
